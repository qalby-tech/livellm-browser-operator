              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Creating
                - Running
                - Stopped
                type: string
              podName:
                description: PodName is the name of the running browser pod.
                type: string
              wsUrl:
                description: |-
                  WsURL is the browser's automation WebSocket URL: for chrome the CDP URL
